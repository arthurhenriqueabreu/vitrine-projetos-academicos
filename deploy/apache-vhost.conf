# Ajuste caminhos e certificado no servidor do Senac. Exponha SOMENTE public/.
<VirtualHost *:443>
    ServerName vitrine.exemplo.senac.br
    DocumentRoot "/var/www/vitrine-projetos-academicos/public"
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/vitrine.pem
    SSLCertificateKeyFile /etc/ssl/private/vitrine.key
    <Directory "/var/www/vitrine-projetos-academicos/public">
        Require all granted
        AllowOverride All
        Options -Indexes
    </Directory>
    <Directory "/var/www/vitrine-projetos-academicos/storage">
        Require all denied
    </Directory>
</VirtualHost>
<VirtualHost *:80>
    ServerName vitrine.exemplo.senac.br
    Redirect permanent / https://vitrine.exemplo.senac.br/
</VirtualHost>
